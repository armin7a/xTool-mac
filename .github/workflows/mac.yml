name: macOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        run: bash Scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xTool-mac
          path: dist/xTool-*.dmg
          if-no-files-found: error
